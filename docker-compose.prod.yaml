name: ${COMPOSE_PROJECT_NAME:-chirorg31-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - database_prod_data:/var/lib/mysql
    networks: [database]
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wojiin/chirorg3.1-backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI is required}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      JWT_SECRET_KEY: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY: /run/secrets/jwt_public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}
      JWT_REFRESH_COOKIE_SECURE: 1
      JWT_REFRESH_SINGLE_USE: 1
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s = @fsockopen(\"127.0.0.1\", 9000); exit($$s ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ${JWT_PRIVATE_KEY_PATH:?JWT_PRIVATE_KEY_PATH is required}:/run/secrets/jwt_private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?JWT_PUBLIC_KEY_PATH is required}:/run/secrets/jwt_public.pem:ro
      - technical_sheet_uploads:/var/www/html/public/uploads
    depends_on:
      database:
        condition: service_healthy
    networks: [database, application]
    logging: *default-logging

  programme_cleanup:
    image: ${BACKEND_IMAGE:-ghcr.io/wojiin/chirorg3.1-backend}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI is required}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      JWT_SECRET_KEY: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY: /run/secrets/jwt_public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}
      JWT_REFRESH_COOKIE_SECURE: 1
      JWT_REFRESH_SINGLE_USE: 1
      PROGRAMME_CLEANUP_HOUR: ${PROGRAMME_CLEANUP_HOUR:-6}
    command: ["sh", "docker/programme-cleanup.sh"]
    volumes:
      - ${JWT_PRIVATE_KEY_PATH:?JWT_PRIVATE_KEY_PATH is required}:/run/secrets/jwt_private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?JWT_PUBLIC_KEY_PATH is required}:/run/secrets/jwt_public.pem:ro
      - technical_sheet_uploads:/var/www/html/public/uploads
    depends_on:
      backend:
        condition: service_healthy
    networks: [database]
    logging: *default-logging

  nginx:
    image: ${BACKEND_NGINX_IMAGE:-ghcr.io/wojiin/chirorg3.1-backend-nginx}:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.backend.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--header=Host: ${APP_HOST:?APP_HOST is required}", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - technical_sheet_uploads:/var/www/html/public/uploads:ro
    networks: [application]
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wojiin/chirorg3.1-frontend}:${IMAGE_TAG:?IMAGE_TAG is required}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      nginx:
        condition: service_healthy
    networks: [application]
    logging: *default-logging

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks: [application, edge_public]
    logging: *default-logging

volumes:
  database_prod_data:
  technical_sheet_uploads:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  application:
    internal: true
  edge_public:
