name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: mysql://chirorg:chirorg@127.0.0.1:3306/chirorg?serverVersion=8.4.0&charset=utf8mb4

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: chirorg_test
          MYSQL_USER: chirorg
          MYSQL_PASSWORD: chirorg
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uchirorg -pchirorg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, pdo_mysql, zip
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate test JWT key pair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Prepare test database
        run: php bin/console doctrine:migrations:migrate --no-interaction
        env:
          APP_ENV: test

      - name: Validate Symfony container
        run: php bin/console lint:container

      - name: Check coding standards
        run: composer run cs:check

      - name: Run static analysis
        run: composer run analyse

      - name: Run backend tests with coverage threshold
        run: composer run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-coverage
          path: backend/build/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Audit Composer dependencies
        run: |
          for attempt in 1 2 3; do
            if composer audit --locked --no-interaction; then
              exit 0
            else
              status=$?
            fi

            if [ "$status" -ne 100 ]; then
              exit "$status"
            fi

            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Packagist is temporarily unavailable; retrying in ${delay}s (${attempt}/3)."
              sleep "$delay"
            fi
          done

          exit "$status"

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run frontend tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Build frontend
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  containers:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Docker Compose
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          config --quiet

      - name: Validate Lighthouse Compose
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          -f docker-compose.lighthouse.yaml
          config --quiet

      - name: Validate production Compose
        run: >
          docker compose
          --env-file .env.prod.example
          -f docker-compose.prod.yaml
          config --quiet

      - name: Validate Caddy configuration
        run: >
          docker run --rm
          -e APP_DOMAIN=chirorg.example.org
          -e ACME_EMAIL=administrateur@example.org
          -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build backend and frontend images
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          build backend frontend

      - name: Build production images
        run: >
          docker compose
          --env-file .env.prod.example
          -f docker-compose.prod.yaml
          build backend nginx frontend

      - name: Start development stack and wait for healthchecks
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          up -d --wait --wait-timeout 180

      - name: Migrate and validate an empty database
        run: |
          docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction
          docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console doctrine:schema:validate

      - name: Smoke test API and frontend
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/api/docs > /dev/null
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/ > /dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml logs --no-color

      - name: Stop development stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml down --volumes

      - name: Generate ephemeral production JWT keys
        run: |
          mkdir -p secrets/jwt
          openssl genpkey -algorithm RSA -aes-256-cbc -pass pass:ci-jwt-passphrase -pkeyopt rsa_keygen_bits:4096 -out secrets/jwt/private.pem
          openssl pkey -in secrets/jwt/private.pem -passin pass:ci-jwt-passphrase -pubout -out secrets/jwt/public.pem

      - name: Start isolated production stack
        env:
          APP_DOMAIN: http://localhost
          APP_HOST: localhost
          HTTP_PORT: 8081
          HTTPS_PORT: 8443
          DEFAULT_URI: http://localhost:8081
          CORS_ALLOW_ORIGIN: ^http://localhost:8081$
          TRUSTED_HOSTS: ^localhost$
          JWT_PASSPHRASE: ci-jwt-passphrase
        run: >
          docker compose
          -p chirorg31-prod-ci
          --env-file .env.prod.example
          -f docker-compose.prod.yaml
          up -d --wait --wait-timeout 180

      - name: Validate production migrations and endpoints
        env:
          APP_DOMAIN: http://localhost
          APP_HOST: localhost
          HTTP_PORT: 8081
          HTTPS_PORT: 8443
          DEFAULT_URI: http://localhost:8081
          CORS_ALLOW_ORIGIN: ^http://localhost:8081$
          TRUSTED_HOSTS: ^localhost$
          JWT_PASSPHRASE: ci-jwt-passphrase
        run: |
          docker compose -p chirorg31-prod-ci --env-file .env.prod.example -f docker-compose.prod.yaml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction
          docker compose -p chirorg31-prod-ci --env-file .env.prod.example -f docker-compose.prod.yaml exec -T backend php bin/console doctrine:schema:validate
          curl --fail --retry 10 --retry-delay 2 http://localhost:8081/api/health > /dev/null
          curl --fail --retry 10 --retry-delay 2 http://localhost:8081/ > /dev/null

      - name: Validate production technical sheet uploads
        env:
          APP_DOMAIN: http://localhost
          APP_HOST: localhost
          HTTP_PORT: 8081
          HTTPS_PORT: 8443
          DEFAULT_URI: http://localhost:8081
          CORS_ALLOW_ORIGIN: ^http://localhost:8081$
          TRUSTED_HOSTS: ^localhost$
          JWT_PASSPHRASE: ci-jwt-passphrase
        run: |
          ADMIN_PASSWORD="Admin-$(openssl rand -hex 16)!"
          printf '%s\n' "$ADMIN_PASSWORD" | docker compose -p chirorg31-prod-ci --env-file .env.prod.example -f docker-compose.prod.yaml exec -T backend php bin/console app:utilisateur:create admin.production-ci@chirorg.test --admin
          ACCESS_TOKEN=$(curl --fail --silent --show-error -X POST http://localhost:8081/api/auth/login -H 'Content-Type: application/json' --data "{\"email\":\"admin.production-ci@chirorg.test\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r '.token')
          test -n "$ACCESS_TOKEN"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > /tmp/chirorg-upload.png
          UPLOAD_URL=$(curl --fail --silent --show-error -X POST http://localhost:8081/api/fiche-technique-images -H "Authorization: Bearer $ACCESS_TOKEN" -F image=@/tmp/chirorg-upload.png | jq -r '.url')
          test -n "$UPLOAD_URL"
          curl --fail --silent --show-error "http://localhost:8081$UPLOAD_URL" --output /tmp/chirorg-upload-result.png
          cmp /tmp/chirorg-upload.png /tmp/chirorg-upload-result.png

      - name: Show production logs on failure
        if: failure()
        env:
          APP_DOMAIN: http://localhost
          APP_HOST: localhost
          JWT_PASSPHRASE: ci-jwt-passphrase
        run: docker compose -p chirorg31-prod-ci --env-file .env.prod.example -f docker-compose.prod.yaml logs --no-color

      - name: Stop isolated production stack
        if: always()
        env:
          APP_DOMAIN: http://localhost
          APP_HOST: localhost
          JWT_PASSPHRASE: ci-jwt-passphrase
        run: docker compose -p chirorg31-prod-ci --env-file .env.prod.example -f docker-compose.prod.yaml down --volumes

  e2e:
    name: End-to-end workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated application stack
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          up -d --build --wait --wait-timeout 180

      - name: Prepare E2E database and accounts
        run: |
          docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction
          docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console doctrine:fixtures:load --no-interaction
          ADMIN_PASSWORD="Admin-$(openssl rand -hex 16)!"
          USER_PASSWORD="User-$(openssl rand -hex 16)!"
          printf '%s\n' "$ADMIN_PASSWORD" | docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console app:utilisateur:create admin.e2e@chirorg.test --admin
          printf '%s\n' "$USER_PASSWORD" | docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console app:utilisateur:create user.e2e@chirorg.test
          echo "E2E_ADMIN_EMAIL=admin.e2e@chirorg.test" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_USER_EMAIL=user.e2e@chirorg.test" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=$USER_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Playwright workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Show application logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml logs --no-color

      - name: Stop E2E stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml down --volumes

  lighthouse:
    name: Lighthouse view audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Lighthouse dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start production-like application stack
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          -f docker-compose.lighthouse.yaml
          up -d --build --wait --wait-timeout 180

      - name: Prepare Lighthouse database
        run: |
          docker compose --env-file .env.example -f docker-compose.dev.yaml -f docker-compose.lighthouse.yaml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction
          docker compose --env-file .env.example -f docker-compose.dev.yaml -f docker-compose.lighthouse.yaml exec -T -e APP_ENV=dev backend php bin/console doctrine:fixtures:load --no-interaction

      - name: Audit every view with Lighthouse
        working-directory: frontend
        run: npm run lighthouse:ci
        env:
          LH_BASE_URL: http://127.0.0.1:5173
          LH_API_BASE_URL: http://127.0.0.1:8080/api
          LH_EMAIL: admin@chirorg.test
          LH_PASSWORD: AdminFixture-2026!
          LH_MIN_PERFORMANCE_MEDIAN: 98
          LH_MIN_PERFORMANCE_MINIMUM: 95
          LH_MIN_ACCESSIBILITY: 100
          LH_MIN_BEST_PRACTICES: 100

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lighthouse-reports
          path: frontend/lighthouse-reports
          if-no-files-found: warn
          retention-days: 14

      - name: Show application logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml -f docker-compose.lighthouse.yaml logs --no-color

      - name: Stop Lighthouse stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml -f docker-compose.lighthouse.yaml down --volumes

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
