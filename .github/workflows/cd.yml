name: Déploiement continu

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement cible
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: deploiement-${{ inputs.environnement }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.nom }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: backend
            contexte: backend
            dockerfile: backend/Dockerfile.prod
            image: ghcr.io/wojiin/chirorg3.1-backend
          - nom: backend-nginx
            contexte: .
            dockerfile: docker/nginx/Dockerfile.backend.prod
            image: ghcr.io/wojiin/chirorg3.1-backend-nginx
          - nom: frontend
            contexte: frontend
            dockerfile: frontend/Dockerfile.prod
            image: ghcr.io/wojiin/chirorg3.1-frontend

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
          provenance: mode=max
          sbom: true

  deployer:
    name: Déployer sur ${{ inputs.environnement }}
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environnement }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Préparer la connexion SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transmettre les fichiers de déploiement
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          tar -czf /tmp/chirorg-deployment.tar.gz docker-compose.prod.yaml docker/caddy/Caddyfile scripts
          scp -P "$DEPLOY_PORT" /tmp/chirorg-deployment.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/chirorg-deployment-${GITHUB_SHA}.tar.gz"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar -xzf '/tmp/chirorg-deployment-${GITHUB_SHA}.tar.gz' -C '$DEPLOY_PATH' && chmod +x '$DEPLOY_PATH'/scripts/*.sh"

      - name: Déployer la version validée
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: >-
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
          "cd '$DEPLOY_PATH' && ENV_FILE='$DEPLOY_PATH/.env.prod' ./scripts/deploy.sh 'sha-${GITHUB_SHA}'"
