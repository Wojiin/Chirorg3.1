name: Audit de sécurité

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-fuzzing:
    name: Fuzzing OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Démarrer la pile isolée
        run: >
          docker compose
          --env-file .env.example
          -f docker-compose.dev.yaml
          up -d --build --wait --wait-timeout 180

      - name: Préparer la base et le compte éphémères
        shell: bash
        run: |
          docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction
          docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console doctrine:fixtures:load --no-interaction
          FUZZ_PASSWORD="Fuzz-$(openssl rand -hex 16)!"
          printf '%s\n' "$FUZZ_PASSWORD" | docker compose --env-file .env.example -f docker-compose.dev.yaml exec -T backend php bin/console app:utilisateur:create fuzz.security@chirorg.test --admin
          ACCESS_TOKEN=$(curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/auth/login -H 'Content-Type: application/json' --data "{\"email\":\"fuzz.security@chirorg.test\",\"password\":\"$FUZZ_PASSWORD\"}" | jq -r '.token')
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "SCHEMATHESIS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "SCHEMATHESIS_PROGRAMME_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Installer la version épinglée de Schemathesis
        run: pipx install schemathesis==4.27.1

      - name: Tester les opérations OpenAPI sans mutation
        shell: bash
        run: |
          mkdir -p tests/security/reports
          schemathesis run http://127.0.0.1:8080/api/docs.jsonopenapi \
            --header "Authorization: Bearer $SCHEMATHESIS_TOKEN" \
            --include-method GET \
            --phases=fuzzing \
            --max-examples=10 \
            --request-timeout=5 \
            --report=junit,json \
            --report-dir=tests/security/reports

      - name: Publier les rapports Schemathesis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemathesis-reports
          path: tests/security/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Afficher les journaux en cas d'échec
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml logs --no-color

      - name: Arrêter et nettoyer la pile isolée
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.dev.yaml down --volumes
