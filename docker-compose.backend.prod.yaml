name: ${COMPOSE_PROJECT_NAME:-chirorg31-prod}

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - database_prod_data:/var/lib/mysql
    networks:
      - database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI is required}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
      JWT_SECRET_KEY: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY: /run/secrets/jwt_public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}
      JWT_REFRESH_COOKIE_SECURE: 1
    volumes:
      - ${JWT_PRIVATE_KEY_PATH:?JWT_PRIVATE_KEY_PATH is required}:/run/secrets/jwt_private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?JWT_PUBLIC_KEY_PATH is required}:/run/secrets/jwt_public.pem:ro
      - technical_sheet_uploads:/var/www/html/public/uploads
    depends_on:
      database:
        condition: service_healthy
    networks:
      - database
      - public

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.backend.prod
    restart: unless-stopped
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    volumes:
      - technical_sheet_uploads:/var/www/html/public/uploads:ro
    networks:
      - public

volumes:
  database_prod_data:
  technical_sheet_uploads:

networks:
  database:
    internal: true
  public:
