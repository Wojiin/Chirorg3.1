# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Gesdinet v3.0.0 stores these cache service ids in parameters. Symfony 8.1
    # no longer resolves those parameterized service references while compiling
    # the vendor definitions, so bind the concrete services explicitly.
    gesdinet_jwt_refresh_token.jwt_revocation_registry:
        class: Gesdinet\JWTRefreshTokenBundle\Security\Revocation\CacheJWTRevocationRegistry
        arguments:
            $pool: '@cache.app'
            $ttl: '%gesdinet_jwt_refresh_token.block_jwts_on_revocation.ttl%'

    gesdinet_jwt_refresh_token.spent_refresh_token_registry:
        class: Gesdinet\JWTRefreshTokenBundle\Security\ReuseDetection\CacheSpentRefreshTokenRegistry
        arguments:
            $pool: '@cache.app'
            $ttl: '%gesdinet_jwt_refresh_token.reuse_detection.ttl%'

    gesdinet_jwt_refresh_token.refresh_rate_limiter:
        class: Gesdinet\JWTRefreshTokenBundle\Security\RateLimiting\RefreshRateLimiter
        arguments:
            $limiterFactory: '@limiter.refresh'
            $key: '%gesdinet_jwt_refresh_token.rate_limiter.key%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    services:
        App\Tests\Functional\Command\E2eCleanupCommand:
            autowire: true
            autoconfigure: true

when@test:
    services:
        App\Tests\Functional\Command\E2eCleanupCommand:
            autowire: true
            autoconfigure: true

        test.user_password_hasher:
            alias: security.user_password_hasher
            public: true
