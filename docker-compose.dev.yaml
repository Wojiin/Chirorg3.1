name: ${COMPOSE_PROJECT_NAME:-chirorg31}

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chirorg}
      MYSQL_USER: ${MYSQL_USER:-chirorg}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chirorg}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - database_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: dev
      APP_SECRET: dev-only-secret
      DATABASE_URL: mysql://${MYSQL_USER:-chirorg}:${MYSQL_PASSWORD:-chirorg}@database:3306/${MYSQL_DATABASE:-chirorg}?serverVersion=8.4.0&charset=utf8mb4
      JWT_PASSPHRASE: dev-only-passphrase
    command: >-
      sh -c "composer install --no-interaction
      && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      && php-fpm"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
      - backend_jwt:/var/www/html/config/jwt
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      database:
        condition: service_healthy

  programme_cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: dev-only-secret
      DATABASE_URL: mysql://${MYSQL_USER:-chirorg}:${MYSQL_PASSWORD:-chirorg}@database:3306/${MYSQL_DATABASE:-chirorg}?serverVersion=8.4.0&charset=utf8mb4
      JWT_PASSPHRASE: dev-only-passphrase
      PROGRAMME_CLEANUP_HOUR: ${PROGRAMME_CLEANUP_HOUR:-6}
    command: ["sh", "docker/programme-cleanup.sh"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
      - backend_jwt:/var/www/html/config/jwt
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/backend.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  database_data:
  backend_vendor:
  backend_var:
  backend_jwt:
  frontend_node_modules:
