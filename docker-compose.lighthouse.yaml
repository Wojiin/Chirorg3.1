services:
  backend:
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      JWT_REFRESH_SINGLE_USE: 0
      # Lighthouse recharge chaque vue et peut renouveler la session plus de
      # 20 fois par minute. Cette surcharge reste limitée à la pile d'audit.
      JWT_REFRESH_RATE_LIMIT: 100
    volumes:
      - backend_var_lighthouse:/var/www/html/var
    command: >-
      sh -c "composer install --no-interaction --prefer-dist --no-progress --no-scripts
      && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      && php bin/console cache:clear --env=prod --no-debug
      && chown -R www-data:www-data var
      && exec php-fpm"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    command: ["nginx", "-g", "daemon off;"]

volumes:
  backend_var_lighthouse:
